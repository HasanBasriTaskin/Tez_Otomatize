name: Windows test ve paket

on:
  push:
    branches: [main, feature/otomatize]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Python bağımlılıkları
        run: python -m pip install -r requirements.lock
      - name: Node bağımlılıkları
        run: npm ci
      - name: TypeScript kontrolü
        run: npm run typecheck
      - name: Python sözdizimi kontrolü
        run: python -m compileall -q literature installer.py run_tray.py run_host.py
      - name: Node bağımlılık güvenlik kontrolü
        run: npm audit --audit-level=high
      - name: Eklenti testleri
        run: npm test
      - name: Python testleri
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          $env:TEMP = (Resolve-Path .tmp).Path
          $env:TMP = $env:TEMP
          python -m unittest discover -s tests -v
      - name: Windows EXE ve Chrome eklentisi derle
        run: python scripts/build-windows.py
      - name: Paketi doğrula ve SHA-256 üret
        run: python scripts/check-package.py
      - name: Kurulum paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: LiteraturKayit-Windows-${{ github.sha }}
          path: |
            release/LiteraturKayit-*.zip
            release/LiteraturKayit-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
