name: Windows test ve paket

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Sürüm etiketi ve yayın bilgilerini doğrula
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/publish-release.py validate
      - name: Bağımlılıklar, testler, Windows ve eklenti, ZIP doğrulama
        shell: cmd
        run: build.bat --no-pause
      - name: Kurulum paketini yükle
        uses: actions/upload-artifact@v4
        with:
          name: LiteraturKayit-Windows-${{ github.sha }}
          path: |
            artifacts/release/LiteraturKayit-*.zip
            artifacts/release/LiteraturKayit-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    # Tag push: publishes that tag. Branch push: publishes package.json's version when it has no tag yet.
    if: github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: LiteraturKayit-Windows-${{ github.sha }}
          path: artifacts/release
      - name: Doğrulanmış paketi Releases sayfasında yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py ${{ startsWith(github.ref, 'refs/tags/v') && 'publish' || 'auto' }}
